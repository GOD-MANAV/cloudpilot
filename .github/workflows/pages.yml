# Website deploy — MANUAL ONLY. The website stays offline until you run this
# (Actions → "Website (GitHub Pages)" → Run workflow). Turn it off again with "unpublish".
name: Website (GitHub Pages)
on:
  workflow_dispatch:
    inputs:
      action:
        description: "publish or unpublish"
        type: choice
        options: [publish, unpublish]
        default: publish

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    if: inputs.action == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build --workspace packages/shared
      - run: npm run build --workspace apps/web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist }
  deploy:
    if: inputs.action == 'publish'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  unpublish:
    if: inputs.action == 'unpublish'
    runs-on: ubuntu-latest
    steps:
      - name: Disable GitHub Pages
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api -X DELETE "repos/${{ github.repository }}/pages" || echo "Pages already off"
