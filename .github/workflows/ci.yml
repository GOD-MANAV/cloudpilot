name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace packages/shared
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint & build Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Validate cloud-init YAML and its first-boot script
        run: |
          python3 - <<'EOF'
          import yaml
          d = yaml.safe_load(open("infra/cloud-init.yaml"))
          bad = [x for x in d["runcmd"] if not isinstance(x, str)]
          assert not bad, f"runcmd items must be plain strings (a ': ' makes YAML read a mapping): {bad}"
          open("/tmp/runcmd.sh", "w").write("#!/bin/sh\n" + "\n".join(d["runcmd"]) + "\n")
          EOF
          sh -n /tmp/runcmd.sh
      - name: ShellCheck bootstrap
        run: shellcheck -S warning infra/bootstrap.sh infra/vm-setup.sh packages/control/pack.sh
