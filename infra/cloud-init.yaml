#cloud-config
# CloudPilot VM bootstrap (Ubuntu 24.04). Placeholders (__X__) are filled in by main.bicep.
package_update: true
package_upgrade: false
packages:
  - git
  - curl
  - jq
  - unzip
  - build-essential
  - python3
  - python3-venv
  - ffmpeg
  - pulseaudio
  - pulseaudio-utils
  - xdotool
  - openbox
  - xterm
  - fonts-noto
  - fonts-noto-color-emoji
  - fonts-noto-cjk
  - ca-certificates
  - gnupg
  - docker.io
  - docker-compose-v2

swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

write_files:
  - path: /etc/cloudpilot/agent.env.tpl
    permissions: "0640"
    content: |
      CP_FQDN=__FQDN__
      CP_OWNER_TOKEN_SHA256=__OWNER_TOKEN_SHA256__
      CP_SIGNING_KEY=__SIGNING_KEY__
      CP_CONTROL_URL=__CONTROL_URL__
      CP_IDLE_MINUTES=__IDLE_MINUTES__
      CP_DATA_DIR=/data
      CP_PORT=8787
      CP_DISPLAY=:1
      CP_KASM_URL=http://127.0.0.1:6901
      CP_CHROME_PATH=/usr/bin/google-chrome-stable
      CP_CHROME_PROFILE=/data/chrome-profile
      CP_AI_USER=dev

  # AI links and shared terminals run as "dev": no sudo, no docker group, no access to
  # /data (meeting sign-ins, Google tokens) or to the agent's secrets.
  - path: /etc/sudoers.d/90-cloudpilot-dev
    permissions: "0440"
    content: |
      __ADMIN__ ALL=(dev) NOPASSWD: ALL

  # "dev" may not reach the Azure instance metadata service or the wire server, so it can't
  # borrow the VM's managed identity (which can stop or resize this VM).
  - path: /etc/systemd/system/cloudpilot-firewall.service
    content: |
      [Unit]
      Description=CloudPilot: keep the sandbox user away from Azure metadata
      Before=network-pre.target
      Wants=network-pre.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/iptables -I OUTPUT -d 169.254.169.254 -m owner --uid-owner dev -j REJECT
      ExecStart=/usr/sbin/iptables -I OUTPUT -d 168.63.129.16 -m owner --uid-owner dev -j REJECT
      ExecStart=/usr/sbin/iptables -I OUTPUT -d 127.0.0.1 -p tcp --dport 6901 -m owner --uid-owner dev -j REJECT

      [Install]
      WantedBy=multi-user.target

  - path: /etc/caddy/Caddyfile
    content: |
      {
        # Certificates persist in /var/lib/caddy, so re-starts don't hit Let's Encrypt limits.
      }

      __FQDN__ {
        encode zstd gzip
        header {
          Strict-Transport-Security "max-age=31536000"
          X-Content-Type-Options nosniff
          Referrer-Policy no-referrer
          -Server
        }
        reverse_proxy 127.0.0.1:8787
      }

      # Live desktop (KasmVNC). Same host, port 8443; cookie set by the agent's /desktop/login.
      __FQDN__:8443 {
        forward_auth 127.0.0.1:8787 {
          uri /auth/desktop
          # Ask "is this person allowed?" as a plain request. Passing the desktop's
          # websocket "Upgrade" on to the agent turns the check itself into a websocket,
          # which reads as a refusal and breaks the live desktop.
          header_up -Upgrade
          header_up -Connection
        }
        reverse_proxy 127.0.0.1:6901 {
          header_up Authorization "Basic {env.CP_KASM_BASIC}"
        }
      }

  - path: /etc/systemd/system/caddy.service.d/override.conf
    content: |
      [Service]
      # "-": HTTPS keeps working even if the desktop password wasn't created.
      EnvironmentFile=-/etc/cloudpilot/kasm.env

  - path: /etc/kasmvnc/kasmvnc.yaml
    content: |
      network:
        protocol: http
        interface: 127.0.0.1
        websocket_port: 6901
        ssl:
          require_ssl: false
        udp:
          public_ip: 127.0.0.1
      desktop:
        resolution:
          width: 1280
          height: 800
        allow_resize: false
      encoding:
        max_frame_rate: 24
      logging:
        log_writer_name: all
        log_dest: logfile
        level: 30

  - path: /etc/systemd/system/cloudpilot-desktop.service
    content: |
      [Unit]
      Description=CloudPilot virtual desktop (KasmVNC on :1)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=forking
      User=__ADMIN__
      Environment=HOME=/home/__ADMIN__
      ExecStartPre=-/usr/bin/vncserver -kill :1
      ExecStart=/usr/bin/vncserver :1 -geometry 1280x800 -depth 24
      ExecStop=/usr/bin/vncserver -kill :1
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/cloudpilot-agent.service
    content: |
      [Unit]
      Description=CloudPilot agent
      After=network-online.target cloudpilot-desktop.service
      Wants=network-online.target cloudpilot-desktop.service

      [Service]
      User=__ADMIN__
      WorkingDirectory=/opt/cloudpilot/packages/agent
      EnvironmentFile=/etc/cloudpilot/agent.env
      Environment=HOME=/home/__ADMIN__
      Environment=XDG_RUNTIME_DIR=/run/user/1000
      Environment=NODE_ENV=production
      ExecStart=/usr/bin/node dist/main.js
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/bin/cloudpilot-update
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Pull the latest agent and restart it. Safe to run any time.
      set -euo pipefail
      cd /opt/cloudpilot
      sudo -u __ADMIN__ git fetch --depth 1 origin "${1:-__AGENT_REF__}"
      sudo -u __ADMIN__ git reset --hard FETCH_HEAD
      sudo -u __ADMIN__ npm ci --workspace packages/shared --workspace packages/agent --include-workspace-root
      sudo -u __ADMIN__ npm run build --workspace packages/shared --workspace packages/agent
      systemctl restart cloudpilot-agent

runcmd:
  # Everything else lives in one re-runnable script in the repo, so a machine can also be
  # repaired later with the same steps (see infra/vm-setup.sh).
  - test -d /opt/cloudpilot/.git || git clone --depth 1 --branch __AGENT_REF__ __AGENT_REPO__ /opt/cloudpilot
  - bash /opt/cloudpilot/infra/vm-setup.sh > /var/log/cloudpilot-setup.log 2>&1

final_message: "CloudPilot ready after $UPTIME seconds"
